:root{--tabh:56px}

.themebtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;flex:none}

de: {"title": "Intervall- und Tonleiter-Spickzettel","tab.iv": "Intervalle","tab.sc": "Tonleitern","iv.h1": "Intervall-Spickzettel","iv.intro": "Ein Intervall ist der Abstand zwischen zwei Tönen, gezählt in Halbtönen. Wähle den Ausgangston und höre jedes Intervall aufwärts, abwärts oder zusammen. Daneben stehen Lieder, an denen man es leicht erkennt.","iv.l1": "reine Konsonanz (reine Intervalle)","iv.l2": "unvollkommene Konsonanz (Terzen und Sexten)","iv.l3": "Dissonanz","iv.rootsAria": "Grundton","iv.from": "Vom Ton","iv.invH": "Umkehrungen","iv.invP": "Eine Umkehrung ist dasselbe Intervall, nachdem der untere Ton eine Oktave nach oben verschoben wurde. Ein Paar ergibt immer 12 Halbtöne. Aus klein wird groß, rein bleibt rein, und der Tritonus wird zu sich selbst.","iv.earH": "Gehörtraining","iv.earP": "Ein zufälliges Intervall erklingt von einem zufälligen Ton: erst Ton für Ton aufwärts, dann beide zusammen.","iv.play": "Intervall abspielen","iv.qmsg": "Klicken, zuhören und eine Antwort wählen.","iv.which": "Welches Intervall ist es?","iv.again": "Wiederholen","iv.next": "Nächstes Intervall","iv.ok": "Richtig: ","iv.bad": "Daneben. Es war: ","iv.foot": "Symbole: m = klein, M = groß, P = rein, A = übermäßig, d = vermindert, TT = Tritonus.","iv.tag.per": "reine Konsonanz","iv.tag.con": "unvollkommene Konsonanz","iv.tag.dis": "Dissonanz","iv.b.play": "Abspielen","iv.b.up": "Aufwärts","iv.b.down": "Abwärts","iv.b.both": "Zusammen","iv.none": "Derselbe Ton zweimal gespielt. Der Ausgangspunkt, um alle anderen zu zählen.","kbd": "Klaviatur:","sc.h1": "Tonleiter-Spickzettel","sc.intro": "Wähle eine Tonart, und alle Tonleitern wechseln dorthin. Zwischen den Noten steht der Abstand: <b>1</b> ist ein Ganzton, <b>½</b> ein Halbton, <b>1½</b> anderthalb Töne. Unter jeder Note steht ihre Stufe, gezählt gegenüber der Dur-Tonleiter. Der Rahmen markiert den Grundton. Die Tasten kann man anklicken.","sc.rootsAria": "Tonart","sc.key": "Tonart","nsys.us": "Amerikanische (englische) Notation, wie in DAWs und rekordbox: B ist der Ton, der in der deutschen Notation H heißt, und B♭ heißt dort B.","sc.intro2": "Alle vier beginnen gleich: <b>{base}</b>. Sie unterscheiden sich nur in der 6. und 7. Stufe, also genügt es, sich diese Tabelle zu merken.","sc.min7": "kleine Septime","sc.maj7": "große Septime","sc.min6": "kleine Sexte","sc.maj6": "große Sexte","t.nat": "Natürlich","t.har": "Harmonisch","t.dor": "Dorisch","t.mel": "Melodisch","sc.play": "Abspielen","semi.1": "1 Halbton","semi.n": "{n} Halbtöne"},
nl: {"title": "Spiekbrief voor intervallen en toonladders","tab.iv": "Intervallen","tab.sc": "Toonladders","iv.h1": "Spiekbrief intervallen","iv.intro": "Een interval is de afstand tussen twee tonen, geteld in halve tonen. Kies de toon waarvan je telt en luister naar elk interval omhoog, omlaag of samen. Ernaast staan liedjes waaraan je het makkelijk herkent.","iv.l1": "zuivere consonant (zuivere intervallen)","iv.l2": "onzuivere consonant (tertsen en sexten)","iv.l3": "dissonant","iv.rootsAria": "Grondtoon","iv.from": "Vanaf toon","iv.invH": "Omkeringen","iv.invP": "Een omkering is hetzelfde interval nadat de onderste toon een octaaf omhoog is verplaatst. Een paar is samen altijd 12 halve tonen. Klein wordt groot, zuiver blijft zuiver en de tritonus wordt zichzelf.","iv.earH": "Gehoortest","iv.earP": "Een willekeurig interval klinkt vanaf een willekeurige toon: eerst toon voor toon omhoog, dan beide samen.","iv.play": "Speel interval","iv.qmsg": "Klik, luister en kies een antwoord.","iv.which": "Welk interval is het?","iv.again": "Herhaal","iv.next": "Volgend interval","iv.ok": "Goed: ","iv.bad": "Mis. Het was: ","iv.foot": "Symbolen: m = klein, M = groot, P = zuiver, A = overmatig, d = verminderd, TT = tritonus.","iv.tag.per": "zuivere consonant","iv.tag.con": "onzuivere consonant","iv.tag.dis": "dissonant","iv.b.play": "Speel","iv.b.up": "Omhoog","iv.b.down": "Omlaag","iv.b.both": "Samen","iv.none": "Dezelfde toon twee keer gespeeld. Het beginpunt om de rest te tellen.","kbd": "Toetsenbord:","sc.h1": "Spiekbrief toonladders","sc.intro": "Kies een toonsoort en alle toonladders schuiven mee. Tussen de noten staat de afstand: <b>1</b> is een hele toon, <b>½</b> een halve toon, <b>1½</b> anderhalve toon. Onder elke noot staat de trap, geteld ten opzichte van de majeurtoonladder. De omranding markeert de grondtoon. Je kunt op de toetsen klikken.","sc.rootsAria": "Toonsoort","sc.key": "Toonsoort","nsys.us": "Amerikaanse (Engelse) notatie, zoals in DAW's en rekordbox: B is de toon die in de Duitse notatie H heet, en B♭ heet daar B.","sc.intro2": "Alle vier beginnen hetzelfde: <b>{base}</b>. Ze verschillen alleen in de 6e en 7e trap, dus je hoeft alleen deze tabel te onthouden.","sc.min7": "kleine septiem","sc.maj7": "grote septiem","sc.min6": "kleine sext","sc.maj6": "grote sext","t.nat": "Natuurlijk","t.har": "Harmonisch","t.dor": "Dorisch","t.mel": "Melodisch","sc.play": "Speel","semi.1": "1 halve toon","semi.n": "{n} halve tonen"},
no: {"title": "Jukselapp for intervaller og skalaer","tab.iv": "Intervaller","tab.sc": "Skalaer","iv.h1": "Jukselapp for intervaller","iv.intro": "Et intervall er avstanden mellom to toner, talt i halvtoner. Velg tonen du teller fra, og hør hvert intervall opp, ned eller sammen. Ved siden av står sanger som gjør det lett å kjenne det igjen.","iv.l1": "ren konsonans (rene intervaller)","iv.l2": "uren konsonans (ters og sekst)","iv.l3": "dissonans","iv.rootsAria": "Grunntone","iv.from": "Fra tone","iv.invH": "Omvendinger","iv.invP": "En omvending er samme intervall etter at den nederste tonen er flyttet en oktav opp. Et par blir alltid til sammen 12 halvtoner. Liten blir stor, ren forblir ren, og tritonus blir seg selv.","iv.earH": "Høretrening","iv.earP": "Et tilfeldig intervall spilles fra en tilfeldig tone: først tone for tone oppover, deretter begge samtidig.","iv.play": "Spill intervall","iv.qmsg": "Klikk, lytt og velg et svar.","iv.which": "Hvilket intervall er det?","iv.again": "Gjenta","iv.next": "Neste intervall","iv.ok": "Riktig: ","iv.bad": "Bom. Det var: ","iv.foot": "Symboler: m = liten, M = stor, P = ren, A = overstigende, d = forminsket, TT = tritonus.","iv.tag.per": "ren konsonans","iv.tag.con": "uren konsonans","iv.tag.dis": "dissonans","iv.b.play": "Spill","iv.b.up": "Opp","iv.b.down": "Ned","iv.b.both": "Sammen","iv.none": "Den samme tonen spilt to ganger. Utgangspunktet for å telle resten.","kbd": "Tangenter:","sc.h1": "Jukselapp for skalaer","sc.intro": "Velg en toneart, så flytter alle skalaene seg dit. Mellom notene står avstanden: <b>1</b> er en hel tone, <b>½</b> en halvtone, <b>1½</b> halvannen tone. Under hver note står trinnet, talt mot durskalaen. Omrisset markerer grunntonen. Du kan klikke på tangentene.","sc.rootsAria": "Toneart","sc.key": "Toneart","nsys.us": "Amerikansk (engelsk) notasjon, som i DAW-er og rekordbox: B er tonen som heter H i norsk og tysk notasjon, og B♭ heter B der.","sc.intro2": "Alle fire begynner likt: <b>{base}</b>. De skiller seg bare på 6. og 7. trinn, så det holder å huske denne tabellen.","sc.min7": "liten septim","sc.maj7": "stor septim","sc.min6": "liten sekst","sc.maj6": "stor sekst","t.nat": "Naturlig","t.har": "Harmonisk","t.dor": "Dorisk","t.mel": "Melodisk","sc.play": "Spill","semi.1": "1 halvtone","semi.n": "{n} halvtoner"},
es: {"title": "Guía rápida de intervalos y escalas","tab.iv": "Intervalos","tab.sc": "Escalas","iv.h1": "Guía rápida de intervalos","iv.intro": "Un intervalo es la distancia entre dos notas, contada en semitonos. Elige la nota desde la que cuentas y escucha cada intervalo ascendente, descendente o a la vez. Al lado hay canciones que ayudan a reconocerlo.","iv.l1": "consonancia perfecta (intervalos justos)","iv.l2": "consonancia imperfecta (terceras y sextas)","iv.l3": "disonancia","iv.rootsAria": "Nota fundamental","iv.from": "Desde la nota","iv.invH": "Inversiones","iv.invP": "Una inversión es el mismo intervalo después de subir una octava la nota inferior. Un par siempre suma 12 semitonos. El menor se convierte en mayor, el justo sigue siendo justo y el tritono se convierte en sí mismo.","iv.earH": "Prueba de oído","iv.earP": "Suena un intervalo aleatorio desde una nota aleatoria: primero nota a nota hacia arriba y luego las dos a la vez.","iv.play": "Reproducir intervalo","iv.qmsg": "Haz clic, escucha y elige una respuesta.","iv.which": "¿Qué intervalo es?","iv.again": "Repetir","iv.next": "Siguiente intervalo","iv.ok": "Correcto: ","iv.bad": "Fallaste. Era: ","iv.foot": "Símbolos: m = menor, M = mayor, P = justo, A = aumentado, d = disminuido, TT = tritono.","iv.tag.per": "consonancia perfecta","iv.tag.con": "consonancia imperfecta","iv.tag.dis": "disonancia","iv.b.play": "Reproducir","iv.b.up": "Ascendente","iv.b.down": "Descendente","iv.b.both": "A la vez","iv.none": "La misma nota tocada dos veces. El punto de partida para contar el resto.","kbd": "Teclado:","sc.h1": "Guía rápida de escalas","sc.intro": "Elige una tonalidad y todas las escalas se desplazan a ella. Entre las notas está la distancia: <b>1</b> es un tono, <b>½</b> un semitono, <b>1½</b> un tono y medio. Debajo de cada nota está su grado, contado respecto a la escala mayor. El contorno marca la fundamental. Puedes hacer clic en las teclas.","sc.rootsAria": "Tonalidad","sc.key": "Tonalidad","nsys.us": "Notación americana (inglesa), como en los DAW y rekordbox: B es la nota que en la notación alemana se llama H, y B♭ se llama allí B.","sc.intro2": "Las cuatro empiezan igual: <b>{base}</b>. Solo se diferencian en los grados 6 y 7, así que basta con recordar esta tabla.","sc.min7": "séptima menor","sc.maj7": "séptima mayor","sc.min6": "sexta menor","sc.maj6": "sexta mayor","t.nat": "Natural","t.har": "Armónica","t.dor": "Dórica","t.mel": "Melódica","sc.play": "Reproducir","semi.1": "1 semitono","semi.n": "{n} semitonos"},
fr: {"title": "Aide-mémoire des intervalles et des gammes","tab.iv": "Intervalles","tab.sc": "Gammes","iv.h1": "Aide-mémoire des intervalles","iv.intro": "Un intervalle est la distance entre deux notes, comptée en demi-tons. Choisissez la note de départ et écoutez chaque intervalle en montant, en descendant ou ensemble. À côté se trouvent des chansons qui aident à le reconnaître.","iv.l1": "consonance parfaite (intervalles justes)","iv.l2": "consonance imparfaite (tierces et sixtes)","iv.l3": "dissonance","iv.rootsAria": "Note fondamentale","iv.from": "À partir de","iv.invH": "Renversements","iv.invP": "Un renversement est le même intervalle après avoir monté la note grave d'une octave. Une paire fait toujours 12 demi-tons. Le mineur devient majeur, le juste reste juste et le triton devient lui-même.","iv.earH": "Test d'oreille","iv.earP": "Un intervalle aléatoire est joué depuis une note aléatoire : d'abord note par note en montant, puis les deux ensemble.","iv.play": "Jouer l'intervalle","iv.qmsg": "Cliquez, écoutez et choisissez une réponse.","iv.which": "Quel est cet intervalle ?","iv.again": "Répéter","iv.next": "Intervalle suivant","iv.ok": "Bien : ","iv.bad": "Raté. C'était : ","iv.foot": "Symboles : m = mineur, M = majeur, P = juste, A = augmenté, d = diminué, TT = triton.","iv.tag.per": "consonance parfaite","iv.tag.con": "consonance imparfaite","iv.tag.dis": "dissonance","iv.b.play": "Jouer","iv.b.up": "En montant","iv.b.down": "En descendant","iv.b.both": "Ensemble","iv.none": "La même note jouée deux fois. Le point de départ pour compter le reste.","kbd": "Clavier :","sc.h1": "Aide-mémoire des gammes","sc.intro": "Choisissez une tonalité et toutes les gammes s'y déplacent. Entre les notes se trouve la distance : <b>1</b> est un ton, <b>½</b> un demi-ton, <b>1½</b> un ton et demi. Sous chaque note se trouve son degré, compté par rapport à la gamme majeure. Le contour marque la fondamentale. Vous pouvez cliquer sur les touches.","sc.rootsAria": "Tonalité","sc.key": "Tonalité","nsys.us": "Notation américaine (anglaise), comme dans les DAW et rekordbox : B est la note appelée H dans la notation allemande, et B♭ s'y appelle B.","sc.intro2": "Les quatre commencent de la même façon : <b>{base}</b>. Elles ne diffèrent que par les 6e et 7e degrés, il suffit donc de retenir ce tableau.","sc.min7": "septième mineure","sc.maj7": "septième majeure","sc.min6": "sixte mineure","sc.maj6": "sixte majeure","t.nat": "Naturelle","t.har": "Harmonique","t.dor": "Dorienne","t.mel": "Mélodique","sc.play": "Jouer","semi.1": "1 demi-ton","semi.n": "{n} demi-tons"}

  SCALES.forEach((x, i) => { if (LANG === 'pl') Object.assign(x, x.pl); else { const X = SC_X[LANG] || SC_EN; x.name = X.name[i]; x.sub = X.sub[i]; x.txt = SC_T[LANG] ? (c) => SC_T[LANG][i].replace('{min}', c.min).replace('{rel}', c.rel) : SC_EN.txt[i]; } });
  SECS.splice(0, 3, ...(LANG === 'pl' ? SECS_PL : (SC_X[LANG] || SC_EN).secs));
};
function spell(sc, pc) {
  const notes = sc.deg.map(([s, m, blue]) => {
    let r = one(sc.q, pc, s, m);
    if (blue) { const alt = one(sc.q, pc, 4, m); if (Math.abs(alt.acc) < Math.abs(r.acc)) r = alt; }
    return r;
  });
  notes.push({ name: nm(sc.q[pc]), acc: 0, semi: pc + 12, deg: '1' });
  return notes;
}
const stepTxt = { 1: '½', 2: '1', 3: '1½' };

// ---- rendering ----
function keyboard(notes, pc) {
  const lab = {}; notes.forEach(n => lab[foldSemi(n.semi)] = n.name);
  const top = pc + 12, W = 40, H = 150;
  const ws = (i) => 12 * Math.floor(i / 7) + LS[i % 7];
  const N = 7 * OCT; // OCT oktaw C–B (domyślnie 2)
  let w = '', b = '';
  for (let i = 0; i < N; i++) {
    const s = ws(i), on = s in lab, x = i * W;
    w += `<rect class="k w${on ? ' on' : ''}" data-s="${s}" x="${x + 1}" y="0" width="${W - 2}" height="${H}" rx="4"/>`;
    if (on) {
      w += `<text class="lw"${KLAB(lab[s], 17, 12)} x="${x + W / 2}" y="${H - 14}">${lab[s]}</text>`;
      if (s % 12 === pc) w += `<circle class="dw" cx="${x + W / 2}" cy="${H - 42}" r="4"/>`;
    }
    if (i < N - 1 && [0, 1, 3, 4, 5].includes(i % 7)) {
      const bs = s + 1, bon = bs in lab, bx = x + W - 12;
      b += `<rect class="k b${bon ? ' on' : ''}" data-s="${bs}" x="${bx}" y="0" width="24" height="92" rx="3"/>`;
      if (bon) {
        b += `<text class="lb"${KLAB(lab[bs], 12, 9)} x="${bx + 12}" y="80">${lab[bs]}</text>`;
        if (bs % 12 === pc) b += `<circle class="db" cx="${bx + 12}" cy="56" r="3"/>`;
      }
    }
  }
  const vw = N * W + 12;
  return `<svg viewBox="0 0 ${vw} ${H + 12}" style="max-width:${N * 48 + 12}px" role="img" aria-label="${t('kbd')} ${notes.map(n => n.name).join(' ')}"><rect class="bed" width="${vw}" height="${H + 12}" rx="9"/><g transform="translate(6,6)">${w}${b}</g></svg>`;
}

function formula(notes) {
  let h = '';
  notes.forEach((n, i) => {
    if (i) { const d = n.semi - notes[i - 1].semi; h += `<span class="st${d !== 2 ? ' h' : ''}">${stepTxt[d]}</span>`; }
    h += `<span class="n${n.deg === '1' ? ' r' : ''}"><b>${n.name}</b><i>${n.deg}</i></span>`;
  });
  return `<div class="formula">${h}</div>`;
}

function render(pc) {
  const c = { min: nm(MIN[pc]), maj: nm(MAJ[pc]), rel: nm(MAJ[(pc + 3) % 12]) };
  let html = '';
  SECS.forEach((title, si) => {
    html += `<section><h2>${title}</h2>`;
    if (si === 1) {
      const base = [[0,0],[1,2],[2,3],[3,5],[4,7]].map(([s, m]) => one(MIN, pc, s, m).name).join(' ');
      const n = (s, m) => one(MIN, pc, s, m).name;
      html += `<p class="intro">${t('sc.intro2').replace('{base}', base)}</p>
      <div class="tblwrap"><table class="cmp">
        <thead><tr><td style="background:none;border:0"></td><th>${t('sc.min7')} <b>♭7 = ${n(6, 10)}</b></th><th>${t('sc.maj7')} <b>7 = ${n(6, 11)}</b></th></tr></thead>
        <tbody>
          <tr><th>${t('sc.min6')} <b>♭6 = ${n(5, 8)}</b></th><td style="--hue:var(--c-nat)">${t('t.nat')}</td><td style="--hue:var(--c-har)">${t('t.har')}</td></tr>
          <tr><th>${t('sc.maj6')} <b>6 = ${n(5, 9)}</b></th><td style="--hue:var(--c-dor)">${t('t.dor')}</td><td style="--hue:var(--c-mel)">${t('t.mel')}</td></tr>
        </tbody></table></div>`;
    }
    SCALES.filter(s => s.sec === si).forEach(sc => {
      const notes = spell(sc, pc);
      html += `<article class="scale" style="--hue:var(--c-${sc.hue})">
        <div class="info">
          <h3>${sc.name}${sc.sub ? ` <small>${sc.sub}</small>` : ''}</h3>
          <p>${sc.txt(c)}</p>
          ${formula(notes)}
          <button class="play" id="play-${sc.id}" data-play="${sc.id}" type="button"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>${t('sc.play')}</button>
        </div>
        <div class="kb" id="kb-${sc.id}">${keyboard(notes, pc)}</div>
      </article>`;
    });
    html += '</section>';
  });
  document.getElementById('sapp').innerHTML = html;
}

if (typeof document !== 'undefined') {
  let pc = 0;
  try { const v = parseInt(localStorage.getItem('root'), 10); if (v >= 0 && v < 12) pc = v; } catch (e) {}
  const LABELS = ['C', 'C♯ / D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'G♯ / A♭', 'A', 'B♭', 'B'];
  const rootsEl = document.getElementById('sroots');
  const buildRoots = () => rootsEl.innerHTML = LABELS.map((l, i) => `<button type="button" id="sroot-${i}" data-root="${i}" aria-pressed="${i === pc}">${conv(l)}</button>`).join('');


  rootsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-root]'); if (!b) return;
    try { localStorage.setItem('root', +b.dataset.root); } catch (err) {}
    window.dispatchEvent(new CustomEvent('rootchange', { detail: +b.dataset.root }));
  });
  const syncRoots = () => rootsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.root === pc));
  const rootsInit = () => buildRoots();
  document.getElementById('sapp').addEventListener('click', (e) => {
    const p = e.target.closest('[data-play]');
    if (p) {
      const sc = SCALES.find(s => s.id === p.dataset.play), box = document.getElementById('kb-' + sc.id);
      const seq = spell(sc, pc).map(n => n.semi);
      Player.play('sc' + sc.id, box, seq.map((x, i) => ({ t: i * 300, semi: x, dur: 0.5, hl: 260 })));
      return;
    }
    const k = e.target.closest('.k');
    if (k) Player.key(k.closest('.kb'), +k.dataset.s, 0.5);
  });
  const panel = document.getElementById('tab-sc');
  const refresh = () => { loc(); applyStatic(panel); buildRoots(); syncRoots(); render(pc); };
  window.addEventListener('rootchange', (e) => { Player.stopAll(); pc = e.detail; syncRoots(); render(pc); });
  window.addEventListener('langchange', () => { Player.stopAll(); refresh(); });
  window.addEventListener('nsyschange', () => { Player.stopAll(); refresh(); });
  window.addEventListener('octchange', () => { Player.stopAll(); refresh(); });
  refresh();
}

      if (e.target.closest('[data-scale]')) { Sound.ensure(); const pc = ((cur.i * 7) + (cur.m ? 9 : 0)) % 12, pat = cur.m ? [0,2,3,5,7,8,10,12] : [0,2,4,5,7,9,11,12];
        Player.play('cf', null, pat.map((x, j) => ({ t: j * 330, semi: pc + x, dur: 0.5 }))); }
    });
    window.addEventListener('stopall', () => Player.stop('cf')); onRedraw(build); build();
  })();

  // ---------- KEY SIGNATURES + STAFF ----------
  (function () {
    const MAJ = ['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'], MIN = ['Am','Em','Bm','F♯m','C♯m','G♯m','E♭m','B♭m','Fm','Cm','Gm','Dm'], N = [0,1,2,3,4,5,6,-5,-4,-3,-2,-1];
    const POS = { 0: { s: [8,5,9,6,3,7,4], f: [4,7,3,6,1,5,2] }, 1: { s: [6,3,7,4,1,5,2], f: [2,5,1,4,0,3,6] } };
    const app = $('stapp'), ksel = $('stkey'), csel = $('stclef');
    let ki = load('stkey', 0, 0, 11), clef = load('stclef', 0, 0, 1), q = null, ok = 0, tot = 0, msg = '', done = false, pick = -1;
    const y = (s) => 110 - 6 * s;
    // clefs are outlines of the open-source Noto Music clef glyphs (SIL OFL), embedded as shapes and
    // positioned against the staff lines, so they look identical on every device (no font needed)
    const TREBLE = '<path fill="currentColor" transform="translate(5.57 110.21) scale(0.04866 -0.04866)" d="M314 801Q300 854 291 906Q282 958 282 1012Q282 1059 288 1100Q295 1142 307 1177Q320 1217 341 1252Q362 1288 386 1311Q409 1334 427 1334Q451 1334 493 1249Q514 1206 524 1156Q534 1106 534 1049Q534 978 515 908Q496 837 460 775Q423 713 372 666L407 498Q422 500 432 501Q442 502 447 502Q508 502 556 468Q604 433 632 377Q661 321 661 254Q661 177 622 116Q582 54 503 25Q508 8 532 -117Q538 -147 541 -164Q544 -182 545 -195Q546 -208 546 -225Q546 -275 522 -314Q497 -354 456 -376Q414 -398 363 -398Q311 -398 271 -378Q231 -359 208 -324Q185 -290 185 -245Q185 -197 212 -165Q238 -133 287 -133Q329 -133 356 -164Q382 -194 382 -236Q382 -272 357 -299Q332 -326 292 -326H282Q308 -365 364 -365Q433 -365 472 -320Q511 -275 511 -205Q511 -188 507 -160Q503 -131 493 -91Q483 -51 478 -25Q472 1 470 12Q436 2 390 2Q304 2 222 52Q142 102 96 184Q50 266 50 361Q50 451 91 530Q132 609 192 675Q253 741 314 801ZM341 826Q364 838 390 870Q416 903 440 945Q464 987 479 1030Q494 1072 494 1106Q494 1142 483 1163Q472 1184 445 1184Q421 1184 398 1162Q376 1140 358 1104Q341 1067 331 1022Q321 977 321 930Q321 898 328 872Q334 846 341 826ZM398 379Q371 373 347 354Q323 334 308 306Q294 279 294 248Q294 223 307 196Q320 170 339 154Q352 142 365 136Q380 129 380 123Q380 120 370 117Q332 126 302 151Q271 176 254 212Q236 247 236 287Q236 330 254 370Q271 410 302 442Q334 474 374 490L345 641Q229 547 174 456Q120 366 120 277Q120 212 154 156Q188 100 247 66Q306 31 380 31Q400 31 420 35Q441 39 464 45ZM495 55Q593 97 593 227Q593 270 571 306Q549 341 512 362Q475 383 429 383Z"/>';
    const BASS = '<path fill="currentColor" transform="translate(5.57 105.80) scale(0.04866 -0.04866)" d="M50 123Q216 231 288 301Q336 348 373 408Q410 469 432 536Q453 603 453 669Q453 728 435 774Q417 819 383 845Q349 871 302 871Q284 871 264 867Q245 863 224 855Q181 839 158 814Q135 788 135 765Q135 756 143 752Q151 748 158 748Q168 748 183 752Q190 754 196 755Q203 756 210 756Q248 756 272 734Q296 711 296 674Q296 638 266 612Q236 586 195 586Q146 586 111 617Q76 648 76 697Q76 756 109 802Q142 848 198 874Q255 900 324 900Q400 900 460 867Q520 834 556 776Q591 719 591 646Q591 551 538 464Q511 419 476 379Q442 339 389 298Q336 256 256 208Q176 160 57 101ZM687 809Q710 809 726 793Q742 777 742 754Q742 731 726 716Q710 700 687 700Q664 700 648 716Q632 731 632 754Q632 777 648 793Q664 809 687 809ZM687 589Q710 589 726 573Q742 557 742 534Q742 511 726 496Q710 480 687 480Q664 480 648 496Q632 511 632 534Q632 557 648 573Q664 589 687 589Z"/>';
    function svg() {
      const n = N[ki], k = Math.abs(n); let g = '';
      for (let i = 0; i < 5; i++) g += '<line x1="6" x2="354" y1="' + (110 - 12 * i) + '" y2="' + (110 - 12 * i) + '" stroke="currentColor"/>';
      g += clef ? BASS : TREBLE;
      const pos = POS[clef][n > 0 ? 's' : 'f'];
      for (let i = 0; i < k; i++) g += '<text x="' + (62 + i * 14) + '" y="' + (y(pos[i]) + 7) + '" font-size="24">' + (n > 0 ? '♯' : '♭') + '</text>';
      if (q !== null) { const x = 300;
        for (let l = -2; l >= q; l -= 2) g += '<line x1="' + (x - 13) + '" x2="' + (x + 13) + '" y1="' + y(l) + '" y2="' + y(l) + '" stroke="currentColor"/>';
        for (let l = 10; l <= q; l += 2) g += '<line x1="' + (x - 13) + '" x2="' + (x + 13) + '" y1="' + y(l) + '" y2="' + y(l) + '" stroke="currentColor"/>';
        g += '<ellipse cx="' + x + '" cy="' + y(q) + '" rx="8" ry="5.5" fill="currentColor" transform="rotate(-18 ' + x + ' ' + y(q) + ')"/>'; }
      return '<svg class="fig" viewBox="0 0 360 150" style="color:var(--fg);" role="img">' + g + '</svg>';
    }
    const letter = () => (clef ? 4 : 2) + q;
    const rightIdx = () => (((letter() % 7) + 7) % 7);
    const semi = () => semiOf(clef ? q - 10 : q + 2);
    function next() { let s; do { s = Math.floor(Math.random() * 13) - 2; } while (s === q); q = s; msg = ''; done = false; pick = -1; build(); Sound.ensure(); Player.play('st', null, [{ semi: semi(), dur: 0.9 }]); }
    function build() {
      applyStatic($('tab-st')); opts(ksel, MAJ.map((m, i) => conv(m) + ' / ' + conv(MIN[i]) + (N[i] ? ' (' + Math.abs(N[i]) + (N[i] > 0 ? '♯' : '♭') + ')' : '')), ki);
      opts(csel, [t('st.treble'), t('st.bass')], clef);
      const L = 'CDEFGAB';
      app.innerHTML = svg() + '<div class="xinfo"><div><b>' + t('st.q') + '</b> ' + (q === null ? '' : '') + '</div></div><div class="qrow">' + [...L].map((c, i) => '<button type="button" data-a="' + i + '"' + (q === null || done ? ' disabled' : '') + (done && i === rightIdx() ? ' class="good"' : done && i === pick ? ' class="bad"' : '') + '>' + conv(c) + '</button>').join('') +
        '</div><div class="xinfo"><div>' + (msg || '') + '</div><div>' + t('st.score') + ': <b>' + ok + ' / ' + tot + '</b></div><div><button type="button" class="xbtn" data-next>' + TRI + t('st.next') + '</button> <button type="button" class="xbtn" data-hear>' + TRI + t('st.hear') + '</button></div></div>';
    }
    ksel.addEventListener('change', () => { ki = +ksel.value; save('stkey', ki); build(); });
    csel.addEventListener('change', () => { clef = +csel.value; save('stclef', clef); q = null; msg = ''; done = false; pick = -1; build(); });
    app.addEventListener('click', (e) => {
      if (e.target.closest('[data-next]')) return next();
      if (e.target.closest('[data-hear]')) { if (q !== null) { Sound.ensure(); Player.play('st', null, [{ semi: semi(), dur: 0.9 }]); } return; }
      const b = e.target.closest('[data-a]'); if (!b || q === null || done) return;
      const right = rightIdx(); tot++; done = true; pick = +b.dataset.a;
      if (pick === right) { ok++; msg = t('st.ok'); } else msg = t('st.no').replace('{n}', conv('CDEFGAB'[right]));
      build();
    });
    onRedraw(build); build();
  })();

})();
// ===== /EXTRA TABS (script) =====

// ===== tabs, language, light/dark switch =====
(function () {
  const panels = [...document.querySelectorAll('[role="tabpanel"]')];
  const ids = panels.map(p => p.id.replace('tab-', ''));
  const bar = document.querySelector('.tabbar');
  const root = document.documentElement;
  const themeBtn = document.getElementById('themebtn');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  const THEME_COLOR = { dark: '#14151b', light: '#f3e3d1' };

  const setTab = (id) => {
    window.dispatchEvent(new Event('stopall'));
    panels.forEach(p => { p.hidden = p.id !== 'tab-' + id; });
    bar.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
    try { localStorage.setItem('tab', id); } catch (e) {}
    window.scrollTo(0, 0);
  };

  // light/dark: the button shows the mode you will switch TO (sun while dark, moon while light)
  const syncTheme = () => {
    const th = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    if (metaTheme) metaTheme.setAttribute('content', THEME_COLOR[th]);
    const label = t(th === 'light' ? 'theme.toDark' : 'theme.toLight');
    themeBtn.setAttribute('aria-label', label); themeBtn.title = label;
  };
  themeBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncTheme();
  });
  try {
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
      let saved = null; try { saved = localStorage.getItem('theme'); } catch (err) {}
      if (!saved) { root.setAttribute('data-theme', e.matches ? 'light' : 'dark'); syncTheme(); }
    });
  } catch (e) {}

  const setLang = (l, first) => {
    LANG = l; document.documentElement.lang = l; document.title = t('title');
    document.getElementById('langsel').value = l;
    applyStatic(bar); syncTheme();
    if (!first) { try { localStorage.setItem('lang', l); } catch (e) {} window.dispatchEvent(new Event('langchange')); }
  };
  const setNsys = (v) => {
    NSYS = v; bar.querySelectorAll('[data-nsys]').forEach(b => b.setAttribute('aria-pressed', b.dataset.nsys === v));
    try { localStorage.setItem('nsys', v); } catch (e) {}
    window.dispatchEvent(new Event('nsyschange'));
  };
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]'); if (b) return setTab(b.dataset.tab);
    const n = e.target.closest('[data-nsys]'); if (n) return setNsys(n.dataset.nsys);
  });
  const instSels = document.querySelectorAll('.instsel');
  instSels.forEach(x => { x.value = INST; x.addEventListener('change', (e) => {
    INST = e.target.value; try { localStorage.setItem('inst', INST); } catch (err) {}
    instSels.forEach(y => y.value = INST);
  }); });
  const octSels = document.querySelectorAll('.octsel');
  const syncOct = () => { document.body.setAttribute('data-oct', OCT); octSels.forEach(y => y.value = OCT); };
  octSels.forEach(x => x.addEventListener('change', (e) => {
    OCT = +e.target.value; try { localStorage.setItem('oct', OCT); } catch (err) {}
    syncOct(); window.dispatchEvent(new Event('octchange'));
  }));
  syncOct();
  document.getElementById('langsel').addEventListener('change', (e) => { if (e.target.value !== LANG) setLang(e.target.value); });
  let tab = ids[0]; try { const s = localStorage.getItem('tab'); if (ids.includes(s)) tab = s; } catch (e) {}
  setLang(LANG, true); bar.querySelectorAll('[data-nsys]').forEach(b => b.setAttribute('aria-pressed', b.dataset.nsys === NSYS)); setTab(tab); window.scrollTo(0, 0);
})();
